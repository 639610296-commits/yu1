.title{

}

.grid{

}

.card{

    padding:18px;
    text-decoration:none;
    color:#222;
    box-shadow:0 10px 24px rgba(0,0,0,.08);

}

.card:hover{

}

.card-top{

}

.card img{

}

.card-info{

}

.card-info h3{

}

.card-info p{

.card-btn{

    border-radius:999px;
    background:linear-gradient(90deg,#47c7ff,#1c8cff);
    color:#fff;
    font-size:18px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
}

.footer{
    text-align:center;
    padding:35px 20px;
    color:#666;
    font-size:14px;
}
</style>
